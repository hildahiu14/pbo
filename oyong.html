<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday App OOP</title>
    <style>
        /* CSS SEDERHANA UNTUK MEMASTIKAN FUNGSI JALAN */
        body, html {
            margin: 0; padding: 0; height: 100%; font-family: sans-serif;
            overflow: hidden; background: #f0f0f0;
        }

        .page {
            display: none; /* Semua halaman sembunyi dulu */
            width: 100%; height: 100vh;
            flex-direction: column; justify-content: center; align-items: center;
            position: absolute; text-align: center;
        }

        #home-page { 
            display: flex; /* Hanya halaman utama yang muncul di awal */
            background-size: cover; background-position: center;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1530103862676-fa8c91bbe178?auto=format&fit=crop&w=1000&q=80');
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 80%; max-width: 400px;
        }

        /* Ikon Amplop */
        .envelope {
            font-size: 50px; cursor: pointer; transition: 0.3s; margin: 20px 0;
        }
        .envelope:hover { transform: scale(1.2); }

        /* Pesan Scroll */
        .scroll-box {
            display: none; max-height: 150px; overflow-y: auto;
            border: 1px solid #ddd; padding: 10px; margin-top: 15px;
            text-align: left; background: #fff;
        }

        /* Galeri */
        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            max-height: 60vh; overflow-y: auto; padding: 10px;
        }
        .grid img { width: 100%; border-radius: 10px; }

        button {
            padding: 10px 20px; cursor: pointer; background: #ff6b6b;
            color: white; border: none; border-radius: 5px; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <div class="card">
            <h1>Siapa yang Ultah?</h1>
            <input type="text" id="nameInput" placeholder="Nama..." style="padding:10px; width:80%"><br>
            <button onclick="app.toMessagePage()">Lanjutkan</button>
        </div>
    </div>

    <div id="message-page" class="page">
        <div class="card">
            <h2 id="greetingTitle"></h2>
            <div class="envelope" onclick="app.openEnvelope()">✉️</div>
            <p id="instruction">Klik amplop untuk buka pesan</p>
            <div id="scrollBox" class="scroll-box">
                <p id="wishText"></p>
            </div>
            <button id="btnToGallery" style="display:none" onclick="app.toGalleryPage()">Lihat Foto-foto</button>
        </div>
    </div>

    <div id="gallery-page" class="page">
        <div class="card">
            <h2>Galeri Foto 📸</h2>
            <div class="grid">
                <img src="https://via.placeholder.com/150" alt="foto1">
                <img src="https://via.placeholder.com/150" alt="foto2">
                <img src="https://via.placeholder.com/150" alt="foto3">
                <img src="https://via.placeholder.com/150" alt="foto4">
            </div>
            <button onclick="location.reload()">Mulai Lagi</button>
        </div>
    </div>

    <script>
        // --- KONSEP OOP ---
        
        class BirthdayApp {
            constructor() {
                // Selektor Elemen
                this.pages = document.querySelectorAll('.page');
                this.nameInput = document.getElementById('nameInput');
                this.greetingTitle = document.getElementById('greetingTitle');
                this.wishText = document.getElementById('wishText');
                this.scrollBox = document.getElementById('scrollBox');
                this.btnToGallery = document.getElementById('btnToGallery');
            }

            // Fungsi pindah halaman yang kuat
            showPage(pageId) {
                this.pages.forEach(p => p.style.display = 'none');
                document.getElementById(pageId).style.display = 'flex';
            }

            toMessagePage() {
                const nama = this.nameInput.value;
                if(!nama) return alert("Isi namanya dulu!");
                
                this.greetingTitle.innerText = "HBD " + nama + "!";
                this.wishText.innerText = `Halo ${nama}, selamat ulang tahun ya! Semoga panjang umur, sehat selalu, dan semua cita-citanya tercapai. Ini adalah pesan panjang yang bisa kamu scroll ke bawah untuk membaca semua doa terbaik dariku... (tambahkan teks lebih banyak di sini agar bisa di-scroll) ... terus ke bawah ... sampai selesai!`;
                
                this.showPage('message-page');
            }

            openEnvelope() {
                this.scrollBox.style.display = 'block';
                this.btnToGallery.style.display = 'inline-block';
                document.getElementById('instruction').innerText = "Scroll ke bawah ya!";
                document.querySelector('.envelope').innerText = "📂";
            }

            toGalleryPage() {
                this.showPage('gallery-page');
            }
        }

        // Jalankan Aplikasi
        const app = new BirthdayApp();
    </script>
</body>
</html>
