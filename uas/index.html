<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* BAGIAN CSS (STYLING)
           Semua teks di dalam blok ini berfungsi untuk mengatur tampilan visual 
        */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;

           /* Menambahkan latar belakang gambar dengan overlay gelap agar teks mudah dibaca */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('gedung_ipwija.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Logo di bagian atas form */
        .logo-top {
            width: 100px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255, 255, 255, 0.95); 
            border-radius: 50%; 
        }

        /* Box pesan error jika login gagal */
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none; /* Disembunyikan secara default */
            align-items: center;
            gap: 12px;
            width: 350px;
        }

        /* Box utama login */
        .box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            width: 320px; 
            text-align: center; 
        }

        /* Judul setelah login berhasil */
        .brand-success {
            font-size: 2.2em;
            font-weight: bold;
            color: #003366; 
        }

        /* Header form login */
        .header-box {
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Group input username dan password */
        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        /* Icon di sebelah kiri input */
        .left-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        /* Icon mata untuk show/hide password */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        /* Style input text */
        .input-group input {
            width: 100%;
            padding: 12px 40px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* Style input jika error */
        .input-error {
            border-color: #dc3545;
            background-color: #fff8f8;
        }

        /* Container tombol */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        /* Tombol login */
        .btn-login { 
            background-color: #003366; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: bold;
        }

        /* Tombol cancel */
        .btn-cancel { 
            background-color: transparent; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 8px; 
        }

        /* Class bantuan untuk menghilangkan elemen dari layar */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    /* Pesan error jika login gagal */
    <div id="errorMsg" class="alert-error">
        <i class="fas fa-circle-xmark"></i>
        <span>Silakan periksa kembali username dan password Anda</span>
    </div>

    /* Box utama */
    <div class="box">

        /* Logo */
        <img src="logo_ipwija.jpg" alt="Logo IPWIJA" class="logo-top">

        /* Form login */
        <div id="form-login">
            <div class="header-box">Silakan Login Terlebih Dahulu!</div>

            /* Input username */
            <div class="input-group">
                <i class="fas fa-user left-icon"></i>
                <input type="text" id="userInp" placeholder="Masukkan Username"
                       oninput="aplikasi.removeError()">
            </div>

            /* Input password */
            <div class="input-group">
                <i class="fas fa-lock left-icon"></i>
                <input type="password" id="passInp" placeholder="Masukkan Password"
                       oninput="aplikasi.removeError()">
                <i class="fas fa-eye-slash toggle-password"
                   onclick="aplikasi.toggleShowPassword()"></i>
            </div>

            /* Tombol aksi */
            <div class="button-stack">
                <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
                <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            </div>
        </div>

        /* Halaman setelah login berhasil */
        <div id="halaman-user" class="hidden">
            <span class="brand-success">Teknik Informatika</span>
            <h2 id="info-user"></h2>
            <p>Anda berhasil login.</p>
            <button class="btn-login" onclick="aplikasi.logout()">Logout</button>
        </div>
    </div>

<script>
    /**
     * 1. CLASS DATABASE (MODEL)
     * Mengelola data mentah dan interaksi dengan LocalStorage browser.
     */
    class Database {
        constructor() {
            // Nama tabel/key dalam penyimpanan lokal browser
            this.key = 'db_user';
            // Inisialisasi data default saat aplikasi dijalankan
            this.init();
        }

        // Menyiapkan data JSON awal untuk simulasi database
        init() {
            const dataAwal = [
                { username: "hilda", password: "123456", name: "Hilda Damayanti" },
                { username: "mahasiswa", password: "241241", name: "Mahasiswa/i IM241" },
                { username: "admin", password: "098765", name: "Admin IM241" }
            ];

            // Simpan data ke storage jika belum pernah ada sebelumnya
            if (!localStorage.getItem(this.key)) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }

        // Mengambil seluruh data user dan mengubahnya kembali ke format Objek/Array
        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    /**
     * 2. CLASS LOGINAPP (CONTROLLER)
     * Mengatur logika alur kerja aplikasi dari login hingga logout.
     */
    class LoginApp {
        constructor() {
            // Instansiasi objek Database di dalam LoginApp (Konsep Komposisi PBO)
            this.db = new Database();
        }

        // Fungsi untuk mengubah tipe input dari password ke teks atau sebaliknya
        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        // Logika utama validasi kredensial login
        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const errorBox = document.getElementById('errorMsg');

            const user = uInput.value.trim();
            const pass = pInput.value.trim();

            // Mengambil data user dari database internal
            const dataUser = this.db.getUsers();

            // Pencarian data yang cocok 
            const found = dataUser.find(u =>
                u.username.toLowerCase() === user.toLowerCase() &&
                u.password === pass
            );

            if (found) {
                // Jika sukses: pindah tampilan ke halaman sambutan
                this.pindahHalaman(found.name);
            } else {
                // Jika gagal: tampilkan pesan error dan beri border merah
                errorBox.style.display = 'flex';
                uInput.classList.add('input-error');
                pInput.classList.add('input-error');
            }
        }

        // Menghapus tanda error pada input saat user mulai memperbaiki ketikan
        removeError() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('userInp').classList.remove('input-error');
            document.getElementById('passInp').classList.remove('input-error');
        }

        // Fungsi UI untuk menyembunyikan form dan menampilkan sapaan user
        pindahHalaman(nama) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('halaman-user').classList.remove('hidden');

            // Format nama agar rapi (Huruf pertama kapital)
            const namaKapital = nama.charAt(0).toUpperCase() + nama.slice(1);
            document.getElementById('info-user').innerText = `Selamat Datang, ${namaKapital}`;
        }

        // Mengembalikan form ke kondisi kosong (bersih)
        reset() {
            this.removeError();
            document.getElementById('userInp').value = "";
            document.getElementById('passInp').value = "";
            document.getElementById('passInp').type = "password";
            document.getElementById('eyeIcon').classList.replace('fa-eye', 'fa-eye-slash');
        }

        // Proses keluar: menyegarkan halaman untuk kembali ke menu login
        logout() {
            location.reload();
        }
    }

    /**
     * 3. INSTANSIASI OBJEK
     * Membuat satu objek global 'aplikasi' agar bisa diakses oleh event onclick di HTML.
     */
    const aplikasi = new LoginApp();
</script>

</body>
</html>
