<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login IPWIJA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            /* Latar belakang gambar Gedung IPWIJA */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('gedung_ipwija.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Logo IPWIJA di dalam box */
        .logo-top {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95em;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
            z-index: 10;
        }

        .box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            width: 320px; 
            text-align: center; 
            backdrop-filter: blur(5px);
        }

        /* Pengganti Ikon Gembok menjadi Teks IM241 */
        .brand-text {
            font-size: 2em;
            font-weight: 800;
            color: #003366; /* Biru gelap senada logo */
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .header-box {
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group i.left-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .input-group input:focus {
            border-color: #003366; /* Fokus ke biru gelap */
            outline: none;
            box-shadow: 0 0 5px rgba(0, 51, 102, 0.2);
        }

        .input-error {
            border-color: #dc3545 !important;
            background-color: #fff8f8;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        /* Tombol Login Biru Gelap */
        .btn-login { 
            background-color: #003366; /* Biru gelap senada logo */
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1em;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #002244;
        }

        .btn-cancel { 
            background-color: transparent; 
            color: #777; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer;
        }

        .hidden { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="errorMsg" class="alert-error">
        <i class="fas fa-circle-xmark" style="font-size: 20px;"></i>
        <span>Silakan periksa kembali username dan password Anda</span>
    </div>

    <div class="box">
        <img src="logo_ipwija.jpg" alt="Logo IPWIJA" class="logo-top">

        <div id="form-login">
            <div class="brand-text">IM241</div>
            <div class="header-box">Silahkan Login Terlebih Dahulu!</div>
            
            <div class="input-group">
                <i class="fas fa-user left-icon"></i>
                <input type="text" id="userInp" placeholder="Masukkan Username" oninput="aplikasi.removeError()">
            </div>

            <div class="input-group">
                <i class="fas fa-lock left-icon"></i>
                <input type="password" id="passInp" placeholder="Masukkan Password" oninput="aplikasi.removeError()">
                <i class="fas fa-eye-slash toggle-password" id="eyeIcon" onclick="aplikasi.toggleShowPassword()"></i>
            </div>

            <div class="button-stack">
                <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
                <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            </div>
        </div>

        <div id="halaman-user" class="hidden">
            <div class="brand-text" style="color: #28a745;">SUCCESS</div>
            <i class="fas fa-circle-check" style="font-size: 50px; color: #28a745; margin-bottom: 10px;"></i>
            <h2 id="info-user" style="color: #28a745; margin: 0;"></h2>
            <p>Selamat datang di sistem.</p>
            <button class="btn-login" style="background-color: #dc3545; width: 100%;" onclick="aplikasi.logout()">Logout</button>
        </div>
    </div>

<script>
    class Database {
        constructor() {
            this.key = 'db_user';
            this.init();
        }

        init() {
            const dataAwal = [
                { username: "user", pw: "241111" },
                { username: "mahasiswa", pw: "241222" },
                { username: "hilda", pw: "241333" }
            ];
            if (!localStorage.getItem(this.key)) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }

        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    class LoginApp {
        constructor() {
            this.db = new Database();
        }

        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const errorBox = document.getElementById('errorMsg');
            
            const user = uInput.value.trim();
            const pass = pInput.value.trim();
            const dataUser = this.db.getUsers();

            const found = dataUser.find(u => u.username === user && u.pw === pass);
