<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f2f5; 
            margin: 0; 
        }
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }

        /* Gaya untuk Ikon Gembok Besar */
        .lock-icon-container {
            margin-bottom: 20px;
            color: #28a745; /* Warna hijau agar sesuai dengan tema login */
        }
        .lock-icon-container i {
            font-size: 3.5em; /* Ukuran ikon gembok */
        }

        /* Header Kotak Merah */
        .header-box {
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* Tampilan Alert Gagal Login */
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: none; /* Sembunyi secara default */
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group i.left-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .input-group input:focus {
            border-color: #28a745;
            outline: none;
        }

        /* Garis merah saat input salah */
        .input-error {
            border-color: #dc3545 !important;
            background-color: #fff8f8;
        }

        /* Group tombol vertikal (Cancel di bawah Login) */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-login { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #218838; }

        .btn-cancel { 
            background-color: transparent; 
            color: #666; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .btn-cancel:hover { background-color: #f0f0f0; color: #333; }

        .hidden { display: none; }
        #info-user { color: #28a745; font-weight: bold; font-size: 1.2em; }
        
        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <div id="form-login">
        <div class="lock-icon-container">
            <i class="fas fa-lock-open"></i> </div>

        <div class="header-box">
            Silahkan Login Terlebih Dahulu!
        </div>

        <div id="errorMsg" class="alert-error">
            <i class="fas fa-circle-xmark"></i>
            <span>Silakan periksa kembali username dan password Anda</span>
        </div>
        
        <div class="input-group">
            <i class="fas fa-user left-icon"></i>
            <input type="text" id="userInp" placeholder="Masukkan Username" oninput="aplikasi.removeError()">
        </div>

        <div class="input-group">
            <i class="fas fa-lock left-icon"></i>
            <input type="password" id="passInp" placeholder="Masukkan Password" oninput="aplikasi.removeError()">
            <i class="fas fa-eye-slash toggle-password" id="eyeIcon" onclick="aplikasi.toggleShowPassword()"></i>
        </div>

        <div class="button-stack">
            <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
            <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
        </div>
    </div>

    <div id="halaman-user" class="hidden">
        <i class="fas fa-circle-check" style="font-size: 50px; color: #28a745; margin-bottom: 10px;"></i>
        <p id="info-user"></p>
        <p>Selamat datang di sistem.</p>
        <button class="btn-logout" onclick="aplikasi.logout()">Logout</button>
    </div>
</div>

<script>
    class Database {
        constructor() {
            this.key = 'db_user';
            this.init();
        }
        init() {
            const dataAwal = [
                { username: "user", pw: "241111" },
                { username: "mahasiswa", pw: "241222" },
                { username: "hilda", pw: "241333" }
            ];
            if (!localStorage.getItem(this.key)) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }
        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    class LoginApp {
        constructor() {
            this.db = new Database();
        }

        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const errorBox = document.getElementById('errorMsg');
            
            const user = uInput.value.trim();
            const pass = pInput.value.trim();
            const dataUser = this.db.getUsers();

            const found = dataUser.find(u => u.username === user && u.pw === pass);
