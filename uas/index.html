<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('gedung_ipwija.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Mencegah warna orange dan border aneh di HP */
        input:focus {
            outline: none !important;
            border-color: #003366 !important;
            box-shadow: 0 0 5px rgba(0, 51, 102, 0.2);
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 310px; /* Dipersempit agar pas di layar HP kecil */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
        }

        .box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            width: 290px; 
            text-align: center; 
        }

        .btn-login { 
            background-color: #003366; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .btn-cancel { 
            background-color: transparent; 
            color: #777; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 8px; 
        }

        .hidden { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="errorMsg" class="alert-error">
        <i class="fas fa-circle-xmark" style="font-size: 20px;"></i>
        <span>Login Gagal! Cek data Anda.</span>
    </div>

    <div class="box">
        <img src="logo_ipwija.jpg" alt="Logo" style="width: 80px; margin-bottom: 10px;">

        <div id="form-login">
            <h3 style="color: #dc3545; margin-bottom: 20px;">Silakan Login</h3>
            
            <div style="position: relative; margin-bottom: 15px; text-align: left;">
                <i class="fas fa-user" style="position: absolute; left: 12px; top: 14px; color: #888;"></i>
                <input type="text" id="userInp" autocomplete="off" placeholder="Username" style="width: 100%; padding: 12px 12px 12px 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd;" oninput="aplikasi.removeError()">
            </div>

            <div style="position: relative; margin-bottom: 15px; text-align: left;">
                <i class="fas fa-lock" style="position: absolute; left: 12px; top: 14px; color: #888;"></i>
                <input type="password" id="passInp" placeholder="Password" style="width: 100%; padding: 12px 12px 12px 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd;" oninput="aplikasi.removeError()">
                <i class="fas fa-eye-slash" id="eyeIcon" style="position: absolute; right: 12px; top: 14px; cursor: pointer; color: #888;" onclick="aplikasi.toggleShowPassword()"></i>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
                <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            </div>
        </div>

        <div id="halaman-user" class="hidden">
            <span style="font-size: 1.8em; font-weight: 800; color: #003366; display: block;">IM241</span>
            <i class="fas fa-circle-check" style="font-size: 50px; color: #003366; margin: 15px 0;"></i>
            <h2 id="info-user" style="color: #003366; margin: 0;"></h2>
            <p>Berhasil masuk sistem.</p>
            <button class="btn-login" style="background-color: #dc3545; width: 100%;" onclick="aplikasi.logout()">Logout</button>
        </div>
    </div>

<script>
    class Database {
        constructor() {
            this.key = 'db_user';
            this.init();
        }

        init() {
            const dataAwal = [
                { username: "hilda", password: "123456", name: "Hilda Damayanti" },
                { username: "mahasiswa", password: "241241", name: "Mahasiswa/i IM241" },
                { username: "admin", password: "098765", name: "Admin IM241" }
            ];
            
            // Logika Auto-Update: Hapus dan timpa jika data di HP versi lama
            const dataLama = localStorage.getItem(this.key);
            if (!dataLama || !dataLama.includes('"name"')) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }

        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    class LoginApp {
        constructor() {
            this.db = new Database();
        }

        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            const isPass = passInput.type === "password";
            passInput.type = isPass ? "text" : "password";
            eyeIcon.classList.toggle('fa-eye-slash');
            eyeIcon.classList.toggle('fa-eye');
        }

        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const userValue = uInput.value.trim().toLowerCase(); // Paksa huruf kecil
            const passValue = pInput.value.trim();
            
            const found = this.db.getUsers().find(u => u.username === userValue && u.password === passValue);

            if (found) {
                this.pindahHalaman(found.name);
            } else {
                document.getElementById('errorMsg').style.display = 'flex';
                uInput.style.borderColor = '#dc3545';
                pInput.style.borderColor = '#dc3545';
            }
        }

        removeError() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('userInp').style.borderColor = '#ddd';
            document.getElementById('passInp').style.borderColor = '#ddd';
        }

        pindahHalaman(nama) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('halaman-user').classList.remove('hidden');
            document.getElementById('info-user').innerText = `Hi, ${nama}`;
        }

        reset() {
            location.reload();
        }

        logout() {
            location.reload();
        }
    }

    const aplikasi = new LoginApp();
</script>
</body>
</html>
