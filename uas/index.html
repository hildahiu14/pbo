<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* CSS: Mengatur tampilan layout agar berada di tengah layar (Centering) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            /* Background gambar dengan lapisan warna gelap agar form login terlihat kontras */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('gedung_ipwija.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Desain Logo IPWIJA */
        .logo-top {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255, 255, 255, 0.95); 
            border-radius: 50%; 
        }

        /* Styling Notifikasi Error (Alert) */
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none; /* Muncul jika login gagal */
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
        }

        /* Styling Container Form (Box Putih) */
        .box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            width: 320px; 
            text-align: center; 
        }

        /* Tombol Login Biru & Cancel Transparan */
        .btn-login { 
            background-color: #003366; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .btn-cancel { 
            background-color: transparent; 
            color: #777; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer;
        }

        .hidden { display: none; } /* Class untuk menyembunyikan elemen */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="errorMsg" class="alert-error">
        <i class="fas fa-circle-xmark" style="font-size: 20px;"></i>
        <span>Silakan periksa kembali username dan password Anda</span>
    </div>

    <div class="box">
        <img src="logo_ipwija.jpg" alt="Logo IPWIJA" class="logo-top">

        <div id="form-login">
            <div class="header-box" style="background-color: #dc3545; color: white; padding: 12px; border-radius: 8px; margin-bottom: 25px; font-weight: bold;">
                Silakan Login Terlebih Dahulu!
            </div>
            
            <div class="input-group" style="position: relative; margin-bottom: 15px; text-align: left;">
                <i class="fas fa-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="text" id="userInp" placeholder="Masukkan Username" style="width: 100%; padding: 12px 12px 12px 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd;" oninput="aplikasi.removeError()">
            </div>

            <div class="input-group" style="position: relative; margin-bottom: 15px; text-align: left;">
                <i class="fas fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                <input type="password" id="passInp" placeholder="Masukkan Password" style="width: 100%; padding: 12px 12px 12px 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd;" oninput="aplikasi.removeError()">
                <i class="fas fa-eye-slash" id="eyeIcon" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;" onclick="aplikasi.toggleShowPassword()"></i>
            </div>

            <div class="button-stack" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
                <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            </div>
        </div>

        <div id="halaman-user" class="hidden">
            <span style="font-size: 2.2em; font-weight: 800; color: #003366; margin-bottom: 15px; display: block;">IM241</span>
            <i class="fas fa-circle-check" style="font-size: 50px; color: #003366; margin-bottom: 10px;"></i>
            <h2 id="info-user" style="color: #003366; margin: 0;"></h2>
            <p>Selamat, Anda berhasil login.</p>
            <button class="btn-login" style="background-color: #dc3545; width: 100%;" onclick="aplikasi.logout()">Logout</button>
        </div>
    </div>

<script>
    /**
     * 1. CLASS DATABASE (MODEL)
     * Mengelola penyimpanan data user di LocalStorage menggunakan konsep Encapsulation.
     */
    class Database {
        constructor() {
            this.key = 'db_user'; // Nama kunci penyimpanan di browser
            this.init();
        }

        /**
         * Method init: Menyiapkan data awal jika belum ada.
         */
        init() {
            const dataAwal = [
                { username: "hilda", password: "123456", name: "Hilda Damayanti" },
                { username: "mhs", password: "241241", name: "Mahasiswa" },
                { username: "admin", password: "098765", name: "Administrator" }
            ];
            
            const storedData = localStorage.getItem(this.key);
            
            // Selalu pastikan data sinkron. 
            // Untuk Case Sensitive, pastikan data di LocalStorage sesuai dengan dataAwal.
            if (!storedData || !storedData.includes('"name"')) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }

        // Method untuk mengambil data JSON dan diubah kembali menjadi Array Objek
        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    /**
     * 2. CLASS LOGINAPP (CONTROLLER)
     * Mengatur logika aplikasi, validasi login dan manipulasi tampilan (DOM).
     */
    class LoginApp {
        constructor() {
            // Relasi Komposisi: Class LoginApp menggunakan objek dari class Database
            this.db = new Database();
        }

        // Method untuk menampilkan/menyembunyikan password
        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        /**
         * Method cekLogin: Validasi input user secara akurat (Case Sensitive).
         */
        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const errorBox = document.getElementById('errorMsg');
            
            // Mengambil nilai asli tanpa mengubah ke huruf kecil agar akurat (Case Sensitive)
            const userValue = uInput.value.trim(); 
            const passValue = pInput.value.trim();
            const dataUser = this.db.getUsers();

            // Mencari user yang username dan password
            const found = dataUser.find(u => u.username === userValue && u.password === passValue);

            if (found) {
                this.pindahHalaman(found.name); 
            } else {
                errorBox.style.display = 'flex'; 
                uInput.style.borderColor = '#dc3545';
                pInput.style.borderColor = '#dc3545';
            }
        }

        // Method untuk menghilangkan tanda error saat user mengetik kembali
        removeError() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('userInp').style.borderColor = '#ddd';
            document.getElementById('passInp').style.borderColor = '#ddd';
        }

        // Method untuk menyembunyikan form login dan menampilkan dashboard user
        pindahHalaman(namaLengkap) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('halaman-user').classList.remove('hidden');
            document.getElementById('info-user').innerText = `Hi, ${namaLengkap}`;
        }

        // Method untuk mereset inputan
        reset() {
            this.removeError();
            document.getElementById('userInp').value = "";
            document.getElementById('passInp').value = "";
        }

        // Method Logout
        logout() {
            location.reload(); 
        }
    }

    // 3. INSTANSIASI OBJEK
    const aplikasi = new LoginApp();
</script>

</body>
</html>
