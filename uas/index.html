<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* CSS Dasar: Mengatur tampilan halaman agar di tengah (center) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; /* Mengatur susunan ke bawah untuk notifikasi error luar */
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f2f5; 
            margin: 0; 
        }

        /* Tampilan Alert Gagal Login (DI LUAR KOTAK LOGIN) */
        .alert-error {
            background-color: #f8d7da; /* Warna latar merah muda */
            color: #721c24;           /* Warna teks merah gelap */
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;       /* Jarak ke kotak login di bawahnya */
            font-size: 0.95em;
            display: none;             /* Sembunyi secara default */
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 350px;              /* Sedikit lebih lebar dari kotak login */
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease; /* Animasi muncul halus */
        }

        /* Kotak Putih Utama (Container Login) */
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }

        /* Ikon Gembok Besar di atas judul */
        .lock-icon {
            font-size: 3em;
            color: #28a745;
            margin-bottom: 15px;
        }

        /* Header Judul (Kotak Merah) */
        .header-box {
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Group Input: Membungkus input agar ikon bisa diletakkan di dalam (absolute) */
        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        /* Ikon kiri (User/Lock) */
        .input-group i.left-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        
        /* Ikon mata (Toggle Password) */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }

        /* Desain Input Fields */
        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        /* Highlight hijau saat input diklik */
        .input-group input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.2);
        }

        /* Efek Merah saat Login Gagal */
        .input-error {
            border-color: #dc3545 !important;
            background-color: #fff8f8;
        }

        /* Stack Tombol: Menyusun Login dan Cancel secara vertikal */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-login { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1em;
        }

        .btn-cancel { 
            background-color: transparent; 
            color: #777; 
            border: 1px solid #ccc; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer;
        }

        .hidden { display: none; } /* Class untuk menyembunyikan elemen */

        /* Animasi Muncul Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="errorMsg" class="alert-error">
        <i class="fas fa-circle-xmark" style="font-size: 20px;"></i>
        <span>Silakan periksa kembali username dan password Anda</span>
    </div>

    <div class="box">
        <div id="form-login">
            <div class="lock-icon"><i class="fas fa-lock-open"></i></div>
            <div class="header-box">Silahkan Login Terlebih Dahulu!</div>
            
            <div class="input-group">
                <i class="fas fa-user left-icon"></i>
                <input type="text" id="userInp" placeholder="Masukkan Username" oninput="aplikasi.removeError()">
            </div>

            <div class="input-group">
                <i class="fas fa-lock left-icon"></i>
                <input type="password" id="passInp" placeholder="Masukkan Password" oninput="aplikasi.removeError()">
                <i class="fas fa-eye-slash toggle-password" id="eyeIcon" onclick="aplikasi.toggleShowPassword()"></i>
            </div>

            <div class="button-stack">
                <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
                <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            </div>
        </div>

        <div id="halaman-user" class="hidden">
            <i class="fas fa-circle-check" style="font-size: 60px; color: #28a745; margin-bottom: 15px;"></i>
            <h2 id="info-user" style="color: #28a745; margin: 0;"></h2>
            <p>Selamat datang di sistem.</p>
            <button class="btn-login" style="background-color: #dc3545; width: 100%;" onclick="aplikasi.logout()">Logout</button>
        </div>
    </div>

<script>
    /**
     * CLASS DATABASE (PBO): 
     * Bertanggung jawab untuk mengelola data user di LocalStorage.
     */
    class Database {
        constructor() {
            this.key = 'db_user';
            this.init();
        }

        // Inisialisasi data awal jika LocalStorage masih kosong
        init() {
            const dataAwal = [
                { username: "user", pw: "241111" },
                { username: "mahasiswa", pw: "241222" },
                { username: "hilda", pw: "241333" }
            ];
            if (!localStorage.getItem(this.key)) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }

        // Mengambil data user dari LocalStorage dan mengubahnya kembali jadi Array of Object
        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    /**
     * CLASS LOGINAPP (PBO): 
     * Berisi logika utama aplikasi (cek login, toggle password, reset).
     */
    class LoginApp {
        constructor() {
            this.db = new Database(); // Komposisi: Menggunakan objek Database
        }

        // Fungsi menampilkan/menyembunyikan password
        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        // Fungsi Validasi Login
        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const errorBox = document.getElementById('errorMsg');
            
            const user = uInput.value.trim();
            const pass = pInput.value.trim();
            const dataUser = this.db.getUsers();

            // Mencari kecocokan username dan password
            const found = dataUser.find(u => u.username === user && u.pw === pass);

            if (found) {
                this.pindahHalaman(found.username);
            } else {
                // MENAMPILKAN ERROR DI LUAR KOTAK
                errorBox.style.display = 'flex'; 
                uInput.classList.add('input-error');
                pInput.classList.add('input-error');
            }
        }

        // Menghapus status error saat user mulai mengetik ulang
        removeError() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('userInp').classList.remove('input-error');
            document.getElementById('passInp').classList.remove('input-error');
        }

        // Berpindah ke tampilan dashboard user
        pindahHalaman(nama) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('halaman-user').classList.remove('hidden');
            document.getElementById('info-user').innerText = `Hi, ${nama}`;
        }

        // Reset semua field input
        reset() {
            this.removeError();
            document.getElementById('userInp').value = "";
            document.getElementById('passInp').value = "";
            document.getElementById('passInp').type = "password";
            document.getElementById('eyeIcon').classList.replace('fa-eye', 'fa-eye-slash');
        }

        // Refresh halaman untuk logout
        logout() {
            location.reload();
        }
    }

    // Instansiasi Objek Utama
    const aplikasi = new LoginApp();
</script>

</body>
</html>
