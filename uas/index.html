<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Sistem Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f2f5; 
            margin: 0; 
        }
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }
        /* Memberi warna pada tulisan judul */
        h2 { color: #28a745; margin-bottom: 20px; font-size: 1.5em; }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group i.left-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        /* Ikon mata untuk password */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }
        .input-group input {
            width: 100%;
            padding: 12px 35px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        /* Efek fokus normal hijau */
        .input-group input:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.2);
        }
        /* Class error untuk garis merah */
        .input-error {
            border-color: #dc3545 !important;
            box-shadow: 0 0 5px rgba(220, 53, 69, 0.2) !important;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-login { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px; 
            flex: 2; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #218838; }

        .btn-cancel { 
            background-color: #f8f9fa; 
            color: #333; 
            border: 1px solid #ddd; 
            padding: 12px; 
            flex: 1; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .btn-cancel:hover { background-color: #e2e6ea; }

        .hidden { display: none; }
        #info-user { color: #28a745; font-weight: bold; font-size: 1.2em; }
        
        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <div id="form-login">
        <h2>Silahkan Login Terlebih Dahulu!</h2>
        
        <div class="input-group">
            <i class="fas fa-user left-icon"></i>
            <input type="text" id="userInp" placeholder="Masukkan Username" oninput="aplikasi.removeError()">
        </div>

        <div class="input-group">
            <i class="fas fa-lock left-icon"></i>
            <input type="password" id="passInp" placeholder="Masukkan Password" oninput="aplikasi.removeError()">
            <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="aplikasi.toggleShowPassword()"></i>
        </div>

        <div class="button-group">
            <button class="btn-cancel" onclick="aplikasi.reset()">Cancel</button>
            <button class="btn-login" onclick="aplikasi.cekLogin()">Login</button>
        </div>
    </div>

    <div id="halaman-user" class="hidden">
        <i class="fas fa-circle-user" style="font-size: 50px; color: #28a745; margin-bottom: 10px;"></i>
        <p id="info-user"></p>
        <p>Selamat datang di sistem.</p>
        <button class="btn-logout" onclick="aplikasi.logout()">Logout</button>
    </div>
</div>

<script>
    class Database {
        constructor() {
            this.key = 'db_user';
            this.init();
        }
        init() {
            const dataAwal = [
                { username: "user", pw: "241111" },
                { username: "mahasiswa", pw: "241222" },
                { username: "hilda", pw: "241333" }
            ];
            if (!localStorage.getItem(this.key)) {
                localStorage.setItem(this.key, JSON.stringify(dataAwal));
            }
        }
        getUsers() {
            return JSON.parse(localStorage.getItem(this.key));
        }
    }

    class LoginApp {
        constructor() {
            this.db = new Database();
        }

        // Fitur lihat password
        toggleShowPassword() {
            const passInput = document.getElementById('passInp');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        cekLogin() {
            const uInput = document.getElementById('userInp');
            const pInput = document.getElementById('passInp');
            const user = uInput.value;
            const pass = pInput.value;
            const dataUser = this.db.getUsers();

            const found = dataUser.find(u => u.username === user && u.pw === pass);

            if (found) {
                this.pindahHalaman(found.username);
            } else {
                // Beri warna merah jika salah
                uInput.classList.add('input-error');
                pInput.classList.add('input-error');
                alert("Username atau Password Salah!");
            }
        }

        // Hapus warna merah saat user mulai mengetik lagi
        removeError() {
            document.getElementById('userInp').classList.remove('input-error');
            document.getElementById('passInp').classList.remove('input-error');
        }

        pindahHalaman(nama) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('halaman-user').classList.remove('hidden');
            document.getElementById('info-user').innerText = `Hi, ${nama}`;
        }

        reset() {
            document.getElementById('userInp').value = "";
            document.getElementById('passInp').value = "";
            this.removeError();
        }

        logout() {
            location.reload();
        }
    }

    const aplikasi = new LoginApp();
</script>

</body>
</html>
